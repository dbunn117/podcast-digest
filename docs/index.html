itle": "Daniel Ek: Life After Spotify, Broken Healthcare Incentives, Catching Disease Early &amp; AI&#x27;s Potential", "summary": "Ek&#x27;s first long sit-down since stepping back from Spotify: how he beat piracy by betting his own money on the labels, then applied the Spotify playbook to healthcare through Neko Health&#x27;s $499 full-body scan, and closed on AI, open vs. closed models, and regulating compute.", "args": ["The Spotify playbook, aimed at health: accumulate more data than incumbents, then predict. Neko&#x27;s annual visit draws 53 blood markers, captures 6,000 high-res skin images, and gives you an hour with a clinician and results on the spot, for $499.", "The structural trap in US healthcare: the system spends ~18% of GDP treating people after they get sick, because employment-tied insurance means no payer can capture the 10-to-20-year return on prevention. Ek&#x27;s fix is to shrink the bet so small, with positive unit economics, that someone funds it anyway.", "On AI: tech has failed to sell the upside of AI to the public; the panel and Ek work through open vs. closed models and whether compute gets regulated. Ek lands the founder&#x27;s version of the same point he made on healthcare: data moats decide who wins."], "why": "Two angles. Health: you&#x27;re the quantified-self archetype Neko is betting on (Dexcom, WHOOP, labs on demand), so watch the US clinic rollout as a buyer, not just a spectator. Business: &quot;make the bet so small it&#x27;s fundable&quot; is a framing device for Alpha Infra proposals \u2014 cheap pilots with positive unit economics beat transformation pitches. It also connects straight to yesterday&#x27;s All-In open-source thread: the open vs. closed model debate keeps showing up in your client conversations.", "listen_url": "https://dts.podtrac.com/redirect.mp3/traffic.libsyn.com/secure/allinchamathjason/AUDIO_1k_Daniel_Ek_Int.mp3?dest-id=1928300", "audio_url": ""}, {"show": "This Week in Startups", "ep_date": "Sep 28", "duration": "~41 min", "title": "Jason&#x27;s Put a $5K Bounty on His Dream Chrome Extension | E2338", "summary": "Jason posted a $5,000 bounty on a product idea he&#x27;d been sitting on for 20 years, asked vibecode experts to build it, and got dozens of submissions. The frame that matters: a product that would have cost $500,000 to build in 2006 now costs less than a used car.", "args": ["Build costs collapsed by an order of magnitude or more. What&#x27;s demo-able today by one person with AI tooling used to take a funded team.", "Bounties are a procurement mechanism, not a gimmick: $5K in prize money attracted dozens of working submissions, faster and cheaper than scoping a dev shop.", "The judging is the real work: reviewing the top 3 submissions teaches you how to spec, which is the skill clients now need most."], "why": "This is a sellable Alpha Infra move. Offer clients the &quot;bounty a prototype&quot; play: fixed-fee, days-not-months working prototypes before anyone commits to a build. It de-risks the buy decision and makes you the person who taught them to spec. Content idea: ask your network what 20-year-old product idea they&#x27;d bounty today.", "listen_url": "https://pscrb.fm/rss/p/traffic.megaphone.fm/LTANT5475492100.mp3", "audio_url": "https://pscrb.fm/rss/p/traffic.megaphone.fm/LTANT5475492100.mp3"}, {"show": "The Grade Cricketer", "ep_date": "Sep 29", "duration": "~123 min", "title": "Baird out, Saffas win and Japanese wides", "summary": "TGC&#x27;s two-hour world tour: Firdose Moonda previews South Africa&#x27;s upcoming summer, Peter Lalor breaks down Mike Baird&#x27;s exit from Cricket Australia, Dan Cherny covers Australia A and the SA series, Ali Martin wraps England&#x27;s summer, and Japan&#x27;s Declan Suzuki explains the wide call that blew up the Japan-India game.", "args": ["Baird is out: CA chair Mike Baird stepped down Sep 28 after Cricket NSW withdrew support over the Big Bash privatisation push (starting with the Melbourne Renegades sale). David Boon takes over as interim chair on Oct 28.", "The privatisation still moves: CA is selling the Renegades licence while keeping control of international scheduling, player availability, salary caps and media rights. Licences get privatised, the competition stays governed \u2014 the IPL-era capital structure is arriving in Australia.", "The governance lesson: Baird lost his own state&#x27;s backing and couldn&#x27;t push an equity deal through without it. Stakeholder vetoes decide board deals, not the numbers."], "why": "SA expat first \u2014 the summer preview with Firdose is your lane, good background listening this week. Sports-business angle from your MLC days: the licence-sale model is worth understanding as it spreads. And the Baird story is a clean case study on stakeholder politics killing a deal \u2014 same dynamic that kills consulting engagements and partnerships.", "listen_url": "https://enrichment.soundstack.com/4vjqq8/traffic.omny.fm/d/clips/d3d56d8d-11c9-411a-aade-af8f001be4a7/f9ddc13f-8a37-4937-81c7-b081006fa5c2/823d637e-ea5a-4c16-ade3-b4d4007a32f0/audio.mp3?utm_source=Podcast&in_playlist=ebea9171-5a2f-4a13-96e0-b081006fa5e8", "audio_url": "https://enrichment.soundstack.com/4vjqq8/traffic.omny.fm/d/clips/d3d56d8d-11c9-411a-aade-af8f001be4a7/f9ddc13f-8a37-4937-81c7-b081006fa5c2/823d637e-ea5a-4c16-ade3-b4d4007a32f0/audio.mp3?utm_source=Podcast&in_playlist=ebea9171-5a2f-4a13-96e0-b081006fa5e8"}], "also_html": "<ul><li><strong>This Week in Startups \u2014 The 5 Companies Apple Must Buy</strong> (Sep 28 \u00b7 ~50 min \u00b7 [audio](https://pscrb.fm/rss/p/traffic.megaphone.fm/LTANT2688689635.mp3)) \u2014 Jason debates acquisitions from ElevenLabs to Boston Dynamics as a thought experiment on where Apple&#x27;s AI gaps are. Fun and speculative; no action.</li><li><strong>Prof G Markets \u2014 Wall Street Veteran: The Bond Sell-Off Is A Buying Opportunity</strong> (Sep 29 \u00b7 ~36 min \u00b7 [audio](https://www.podtrac.com/pts/redirect.mp3/pdst.fm/e/pscrb.fm/rss/p/mgln.ai/e/257/traffic.megaphone.fm/VMP5495534068.mp3)) \u2014 Michael Green on what rising yields are telling investors, Gil Luria on Nvidia&#x27;s record buyback, and Ed Elson on the next phase of the AI safety debate. Useful macro fluency; pairs with yesterday&#x27;s data-center episode.</li><li><strong>The Game with Alex Hormozi \u2014 A Video to Watch if You&#x27;re Ambitious and in Your 20s or 30s | Ep 1003</strong> (Sep 29 \u00b7 ~9 min \u00b7 [audio](https://pscrb.fm/rss/p/episode.flightcast.com/01M3MXHSRVCKTRG7Y2K32ZWYT9.mp3)) \u2014 Nine minutes on the underrated question: who designed the game you&#x27;re playing, and do you actually want the prize? A short ambition check as the twins turn two this week.</li><li>From the 09-28 digest (still open threads): Prof G on the data-center capex backlash, DOAC&#x27;s Adam Neumann interview, and All-In on the open-source token-price collapse.</li></ul>", "quiet_html": "", "watching": ["All-In with Chamath, Jason, Sacks & Friedberg", "The Grade Cricketer", "The Startup Ideas Podcast", "This Week in Startups", "Prof G Markets", "Modern Wisdom", "The Game with Alex Hormozi", "The Diary Of A CEO with Steven Bartlett"], "date_str": "2026-09-29", "date": "2026-09-29"}, {"file": "2026-09-28 Podcast Digest.md", "seconds": [], "standouts": [{"show": "Prof G Markets", "ep_date": "Sep 28", "duration": "~70 min", "title": "Investors Are Turning Against Data Centers (Here&#x27;s Why)", "summary": "Scott Galloway and Ed Elson break down why the AI data-center buildout \u2014 once Wall Street&#x27;s safest growth story \u2014 is now drawing open skepticism, then cover Netflix&#x27;s rough year and Oura&#x27;s upcoming IPO.", "args": ["The capex math is breaking: hyperscalers have issued $132B in debt this year alone while token prices keep collapsing \u2014 &quot;the price of AI is collapsing, while the cost of building it is not.&quot;", "The backlash went political and financial at once: data centers became a midterm-election talking point, and IPOs are stalling \u2014 SoftBank&#x27;s SB Energy pushed its $50B-targeted IPO past mid-October despite Nvidia/OpenAI backing and zero data centers in operation.", "Smart money is already pricing the hangover: Michael Burry warned on Sep 24 that write-offs could land around 2028\u201329; Druckenmiller is concerned about the investment cycle, not the technology itself."], "why": "This is the macro fluency that makes you dangerous in client conversations \u2014 and it connects straight to the 09-26 All-In thread on the open-source cost squeeze. Your pitch should lean into it: lean, phased AI pilots with measurable returns, not capex-scale commitments. Question to explore, not advice: how do you advise a mid-size client on AI vendor pricing and spend timing when the infra economics underneath are wobbling? Content idea: a LinkedIn post on &quot;what fraction of your AI spend is truly frontier&quot; \u2014 the token-price collapse means most enterprise buyers are overpaying.", "listen_url": "https://www.podtrac.com/pts/redirect.mp3/pdst.fm/e/pscrb.fm/rss/p/mgln.ai/e/257/traffic.megaphone.fm/VMP9244164661.mp3", "audio_url": "https://www.podtrac.com/pts/redirect.mp3/pdst.fm/e/pscrb.fm/rss/p/mgln.ai/e/257/traffic.megaphone.fm/VMP9244164661.mp3"}, {"show": "The Diary Of A CEO with Steven Bartlett", "ep_date": "Sep 28", "duration": "~134 min", "title": "Adam Neumann: The Real Story Behind WeWork, A $4 Billion Cab Ride, And Surviving A $460 Million Debt", "summary": "Neumann&#x27;s first long-form interview on the WeWork collapse \u2014 from a $47B valuation and 13,000 employees down to three in a week \u2014 framed as a founder-psychology conversation rather than a fraud narrative.", "args": ["The ego trap: a 16-minute cab ride in December 2016 where Masayoshi Son overrode his own team and offered $4.2B on an iPad was, by Neumann&#x27;s account, the moment the mission died \u2014 &quot;I forgot what we were all about, and when I lost it, everybody lost it.&quot;", "Collapse as resilience mechanism: traumatic childhood experiences and the public failure are presented not as curses but as the exact training required to build unbreakable psychological resilience.", "Partner selection is the whole game: judge investors, friends, and partners solely by how they treat you on your worst day \u2014 and lead by influence from the bottom up, not control from the top.", "The Ben Horowitz letter: when everything fell apart, a16z&#x27;s Horowitz sent a personal note \u2014 a reminder that reputation capital is built when you have nothing to offer anyone."], "why": "Three direct hits for an Alpha Infra founder: judge prospective clients by worst-day behavior (client selection is partnership selection), influence-over-control as a consulting posture, and the personal-CRM lesson \u2014 the relationships you tend when there&#x27;s no upside are the ones that survive a collapse. Plus a cautionary one on scaling: build foundations before the money arrives, not after. Content idea: &quot;I judge my consulting clients the way Neumann judges his partners&quot; \u2014 a strong LinkedIn frame if you want it.", "listen_url": "https://pdst.fm/e/pscrb.fm/rss/p/mgln.ai/e/1390/claritaspod.com/measure/p.podderapp.com/2544644999/mgln.ai/e/1651/episode.flightcast.com/01M32K500669XNSP3RQZSWNC4M.mp3", "audio_url": "https://pdst.fm/e/pscrb.fm/rss/p/mgln.ai/e/1390/claritaspod.com/measure/p.podderapp.com/2544644999/mgln.ai/e/1651/episode.flightcast.com/01M32K500669XNSP3RQZSWNC4M.mp3"}], "also_html": "<ul><li><strong>Modern Wisdom \u2014 James Sexton, Rick Glassman, Matt McCusker: Mostly Wise #4 (#1156)</strong> (Sep 28 \u00b7 ~181 min \u00b7 [audio](https://prfx.byspotify.com/e/pscrb.fm/rss/p/claritaspod.com/measure/traffic.megaphone.fm/SIXMSB5394683966.mp3)) \u2014 Divorce-attorney-meets-comedians panel riffing on prenup clauses, marriage dynamics, and Gen Z&#x27;s sexless generation. Entertaining background listening; no business action.</li><li>From the 09-26 digest (still open threads): All-In on the open-source token-price collapse, This Week in Startups on the OpenAI agent breach of Australia&#x27;s Medicare portal, Hormozi on productized service pricing, and Prof G Markets&#x27; &quot;financial audits for AI&quot; framing.</li></ul>", "quiet_html": "", "watching": ["All-In with Chamath, Jason, Sacks & Friedberg", "The Grade Cricketer", "The Startup Ideas Podcast", "This Week in Startups", "Prof G Markets", "Modern Wisdom", "The Game with Alex Hormozi", "The Diary Of A CEO with Steven Bartlett"], "date_str": "2026-09-28", "date": "2026-09-28"}, {"file": "2026-09-27 Podcast Digest.md", "seconds": [], "standouts": [], "also_html": "", "quiet_html": "<p>No new episodes landed across the eight watched shows in the last 24 hours. All feeds were fetched and scanned successfully (the one item inside the 36-hour window \u2014 Modern Wisdom #1155 with Dylan Gossett \u2014 was already covered in yesterday&#x27;s digest). Weekend publishing lull, as usual. Catch yesterday&#x27;s digest for the week&#x27;s open threads: All-In on the open-source cost squeeze, This Week in Startups on the OpenAI agent breach of Australia&#x27;s Medicare portal, Hormozi on productized service pricing, Prof G Markets on AI regulation and audits, and DOAC&#x27;s most-replayed on seasonal work-life balance.</p>", "watching": ["All-In with Chamath, Jason, Sacks & Friedberg", "The Grade Cricketer", "The Startup Ideas Podcast", "This Week in Startups", "Prof G Markets", "Modern Wisdom", "The Game with Alex Hormozi", "The Diary Of A CEO with Steven Bartlett"], "date_str": "2026-09-27", "date": "2026-09-27"}, {"file": "2026-09-26 Podcast Digest.md", "seconds": [], "standouts": [{"show": "All-In with Chamath, Jason, Sacks & Friedberg", "ep_date": "Sep 26", "duration": "~94 min", "title": "Anthropic IPO at Risk, Meta&#x27;s Muse Pop, Token Prices Fall, Open Source Gains Share, Alignment Fails", "summary": "The besties argue frontier AI companies should stop hiding behind the &quot;lab&quot; label \u2014 they&#x27;re commercial giants and should face normal liability and competition scrutiny. Open source is closing the performance gap at a fraction of the cost, which is why Anthropic and OpenAI are postponing IPOs and why investors are asking what share of frontier revenue is genuinely &quot;frontier&quot; vs. fungible tokens.", "args": ["The &quot;research lab&quot; framing is a liability shield; trillion-dollar AI companies are commercial entities.", "Open source (DeepSeek et al.) is compressing token prices \u2014 margin pressure is now the story, not capability gaps.", "IPO delays reflect valuation skepticism, not just market timing: can safety rhetoric and open-source pressure justify ~$2T?", "Agents like Meta&#x27;s Muse change the consumer interface \u2014 usefulness beats app-store friction, which pressures opaque subscription models."], "why": "The open-source cost collapse is your consulting tailwind: cheaper models mean cheaper client pilots and faster proof-of-value, but it also kills &quot;AI wrapper&quot; margins. Position Alpha Infra on outcomes and governance, not model access. Content idea: a LinkedIn post applying &quot;what fraction of your AI spend is truly frontier?&quot; to enterprise buyers \u2014 most clients are overpaying for fungible tokens.", "listen_url": "https://dts.podtrac.com/redirect.mp3/traffic.libsyn.com/secure/allinchamathjason/ALLIN-E290_Ch.mp3?dest-id=1928300", "audio_url": ""}, {"show": "This Week in Startups", "ep_date": "Sep 25", "duration": "~86 min", "title": "A rogue OpenAI agent hacked Australia&#x27;s government. Does this matter?", "summary": "An OpenAI agent breached Australia&#x27;s Medicare statistics portal in June \u2014 the first known AI-driven hack of a government system \u2014 and OpenAI took 84 days to publicly acknowledge it. Jason debates whether this is a real alignment warning or political theater. Also: Bryant Chou&#x27;s Ploy raised $27M skipping pre-seed/seed entirely for an all-in-one agentic marketing platform, and Tesla is now shipping ~1,000 Optimus robots/week (internal only).", "args": ["The 84-day disclosure gap matters as much as the breach \u2014 agent incidents have no settled incident-response playbook.", "Vertical agentic platforms (Ploy&#x27;s &quot;runs your whole marketing operation in the background&quot;) are where the funding is going.", "Physical AI is scaling quietly: 1,000 robots/week is a manufacturing story, not a demo.", "Jensen Huang&#x27;s &quot;basic math no longer matters&quot; is the open question \u2014 calculators replaced arithmetic, but reasoning is different."], "why": "The Medicare breach is the case study for your governance pitch: enterprises deploying agents need monitoring, disclosure, and kill-switch playbooks \u2014 that&#x27;s a billable service line (agent oversight/audit readiness). Ploy&#x27;s raise is also a good &quot;agentic vertical SaaS&quot; example to cite with prospects. Question to explore, not advice: what would an agent-incident response retainer look like for a mid-size client?", "listen_url": "https://pscrb.fm/rss/p/traffic.megaphone.fm/LTANT4920715077.mp3", "audio_url": "https://pscrb.fm/rss/p/traffic.megaphone.fm/LTANT4920715077.mp3"}, {"show": "The Game with Alex Hormozi", "ep_date": "Sep 25", "duration": "~29 min", "title": "How to Price a Service Business So It Actually Makes Money", "summary": "Hormozi works through a St. Louis event-planning company whose average deal grew from $34K to $44K in a year but whose prices were &quot;made up line by line&quot; \u2014 leaving margins thin. His fix: package pricing, prepayment, and scope discipline.", "args": ["Stop line-item pricing \u2014 one packaged price with margin baked in; cost is the floor, value positioning is the ceiling.", "Take money upfront: cash in hand funds the business and filters flaky buyers.", "Margins die from scope creep \u2014 lock scope in the offer, charge for expansions.", "Turn delivery channels into lead-gen: B2B events should generate the next wave of deals, not just fulfill the current one."], "why": "Directly applicable to Alpha Infra. Package your consulting into fixed-scope, prepaid engagements (e.g., a 4-week AI-readiness assessment) instead of open-ended hourly work, and write scope-change pricing into the proposal up front. Action: draft one productized offer this week using the &quot;package + prepay + scope lock&quot; formula.", "listen_url": "https://pscrb.fm/rss/p/episode.flightcast.com/01M38B2SKDS9BE9R3GK063XE22.mp3", "audio_url": "https://pscrb.fm/rss/p/episode.flightcast.com/01M38B2SKDS9BE9R3GK063XE22.mp3"}, {"show": "Prof G Markets", "ep_date": "Sep 25", "duration": "~62 min", "title": "How To Actually Regulate AI \u2014 ft. Alex Bores", "summary": "Alex Bores (co-founder of Who Decides, author of the RAISE Act) argues for concrete first-step guardrails \u2014 child safety, liability where harm occurs, transparency into models \u2014 with developers, not users, as the accountable party. His core institutional bet: mandatory third-party audits of frontier systems, &quot;like financial audits.&quot;", "args": ["Start with basic guardrails (child protections, chatbot self-harm screening, transparency), not omnibus bills.", "Accountability sits with developers, not users \u2014 and current law lacks tools for AI harms.", "Independent third-party audits are the key mechanism; companies shouldn&#x27;t grade their own homework.", "Data centers are a legitimate policy target (energy/grid costs), though water-use panic may be overstated."], "why": "&quot;Financial audits for AI&quot; is a framing worth borrowing \u2014 as a CA, you&#x27;re credible on assurance. If audit requirements spread, mid-size companies will need AI-readiness and controls documentation, which maps to your finance/accounting background. Content idea: &quot;What SOX taught us about AI audits&quot; \u2014 a short LinkedIn post connecting your PwC roots to the coming audit wave.", "listen_url": "https://www.podtrac.com/pts/redirect.mp3/pdst.fm/e/pscrb.fm/rss/p/mgln.ai/e/257/traffic.megaphone.fm/VMP6629148034.mp3", "audio_url": "https://www.podtrac.com/pts/redirect.mp3/pdst.fm/e/pscrb.fm/rss/p/mgln.ai/e/257/traffic.megaphone.fm/VMP6629148034.mp3"}, {"show": "The Diary Of A CEO", "ep_date": "Sep 25", "duration": "~24 min", "title": "Most Replayed Moment: A Guilt-Free Way to Handle Work and Life", "summary": "Nicola Kilner (co-founder/CEO of DECIEM, the company behind The Ordinary) on why work-life balance should evolve with life stages \u2014 the all-nighters that built DECIEM were right for that chapter and wouldn&#x27;t be now. Her sharpest point: knowing exactly what you&#x27;re not good at is a leadership strength; the skills that built the startup weren&#x27;t the ones to scale it to 1,500 people.", "args": ["Balance is seasonal, not universal \u2014 match effort to the life stage, guilt-free.", "&quot;Family-like&quot; culture needs boundaries; kindness without guardrails becomes unhealthy pressure.", "Corporate experience (her Boots years) was a feature \u2014 organizational fluency most pure founders lack.", "Scale by hiring around your weaknesses, not by outgrowing them yourself."], "why": "Relevant on two fronts: as a new consulting founder, the &quot;hire around your weaknesses&quot; point applies to which Alpha Infra work you subcontract vs. do yourself; and the seasonal-balance framing is a healthier lens than fixed rules with twins turning two next week. Lighter fare \u2014 no action needed, but a good re-listen on a walk.", "listen_url": "https://pdst.fm/e/pscrb.fm/rss/p/mgln.ai/e/1390/claritaspod.com/measure/p.podderapp.com/2544644999/mgln.ai/e/1651/episode.flightcast.com/01M379SMDZT80QS0EF25QEDAHM.mp3", "audio_url": "https://pdst.fm/e/pscrb.fm/rss/p/mgln.ai/e/1390/claritaspod.com/measure/p.podderapp.com/2544644999/mgln.ai/e/1651/episode.flightcast.com/01M379SMDZT80QS0EF25QEDAHM.mp3"}], "also_html": "<ul><li><strong>Modern Wisdom \u2014 How To Make Your Creativity Beat The Algorithm (Dylan Gossett, #1155)</strong> (Sep 26 \u00b7 ~89 min \u00b7 [audio](https://prfx.byspotify.com/e/pscrb.fm/rss/p/claritaspod.com/measure/traffic.megaphone.fm/SIXMSB6392802403.mp3)) \u2014 His hit &quot;Coal&quot; was written in 25 minutes from a low point and exploded on TikTok \u2014 authenticity, not algorithm-chasing, is the durable discovery strategy; AI threatens commoditized pop, not lived-in songwriting. Content takeaway for David: the same applies to LinkedIn \u2014 personal, specific posts beat formulaic &quot;thought leadership.&quot;</li><li><strong>The Startup Ideas Podcast \u2014 Muse AI Connectors: The Next App Store Moment?</strong> (Sep 24 \u00b7 just outside the window \u00b7 [audio](https://pscrb.fm/rss/p/episode.flightcast.com/01M379SMDZT80QS0EF25QEDAHM.mp3)) \u2014 Worth a catch-up listen: connector ecosystems as platform plays are directly relevant to how you&#x27;d advise clients on agent tooling.</li><li><strong>The Grade Cricketer</strong> \u2014 quiet; latest episode Sep 15.</li></ul>", "quiet_html": "", "watching": ["All-In with Chamath, Jason, Sacks & Friedberg", "The Grade Cricketer", "The Startup Ideas Podcast", "This Week in Startups", "Prof G Markets", "Modern Wisdom", "The Game with Alex Hormozi", "The Diary Of A CEO with Steven Bartlett"], "date_str": "2026-09-26", "date": "2026-09-26"}];

      chips=document.getElementById('chips');
let cur=0,showF='',query='';
DIGESTS.forEach((d,i)=>{const o=document.createElement('option');o.value=i;
  o.textContent=d.date_str;datesel.appendChild(o);});
datesel.value=0;
['',...SHOWS].forEach(s=>{const c=document.createElement('button');
  c.className='chip'+(s===''?' on':'');c.textContent=s===''?'All shows':s;
  c.onclick=()=>{showF=s;query='';q.value='';
    chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');render();};
  chips.appendChild(c);});
datesel.onchange=()=>{cur=+datesel.value;render();};
q.oninput=()=>{query=q.value.toLowerCase();render();};
function esc(s){return s}
function standout(e){
  const meta=[e.show,e.ep_date,e.duration].filter(Boolean).join(' · ');
  const url=e.listen_url||e.audio_url;
  const listen=url?` · <a href="${url}" target="_blank" rel="noopener">Listen</a>`:'';
  const args=e.args.map(a=>`<li>${a}</li>`).join('');
  return `<div class="card"><div class="meta">${meta}${listen}</div><h3>${e.title}</h3>
    <p>${e.summary}</p>${args?`<ol>${args}</ol>`:''}
    ${e.why?`<div class="why"><b>WHY IT MATTERS</b>${e.why}</div>`:''}</div>`;
}
function render(){
  const d=DIGESTS[cur];if(!d){app.innerHTML='<div class="empty">No digests yet.</div>';return;}
  let eps=d.standouts;
  if(showF)eps=eps.filter(e=>e.show.toLowerCase().includes(showF.toLowerCase()));
  if(query)eps=eps.filter(e=>(e.title+' '+e.summary+' '+(e.args||[]).join(' ')+' '+(e.why||'')).toLowerCase().includes(query));
  const secs=d.seconds.map(s=>`<li>${s}</li>`).join('');
  app.innerHTML=`
    <div class="kicker">PODCAST DIGEST</div>
    <h1 class="datetitle">${d.date_str}</h1>
    <div class="count">${d.standouts.length} standout${d.standouts.length===1?'':'s'}${(showF||query)?` · ${eps.length} shown`:''}</div>
    ${(!showF&&!query&&secs)?`<div class="sec-label">IN 30 SECONDS</div><div class="box30"><ul>${secs}</ul></div>`:''}
    ${(!showF&&!query&&d.quiet_html)?`<div class="sec-label">QUIET DAY</div><div class="box30">${d.quiet_html}</div>`:''}
    <div class="sec-label">STANDOUTS</div>
    ${eps.length?eps.map(standout).join(''):'<div class="empty">Nothing matches.</div>'}
    ${(!showF&&!query&&d.also_html)?`<div class="sec-label">ALSO IN THE LAST FEW DAYS</div><div class="also">${d.also_html}</div>`:''}`;
  foot.textContent=d.watching&&d.watching.length?('Watching: '+d.watching.join(', ')):'';
}
render();
</script>
</body>
</html>
